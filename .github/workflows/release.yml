name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出源码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，确保能找到所有 tag

      - name: Checkout tag
        run: |
          # 确定目标 TAG
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          echo "Target TAG: $TAG"

          if [[ ! "$TAG" =~ ^v.+$ ]]; then
            echo "❌ TAG 必須以 v 開頭 (目前: $TAG)"
            exit 1
          fi

          git fetch --tags --force
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "❌ 找不到 tag: $TAG"
            exit 1
          fi
          git checkout "refs/tags/$TAG"

          echo "TAG=$TAG" >> $GITHUB_ENV

      # 2. 配置 JDK
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 赋予 Gradle 可执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. 导入签名密钥
      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 --decode > release.keystore
          echo "RELEASE_STORE_FILE=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.SIGNING_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PWD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PWD }}" >> $GITHUB_ENV

      # 5. 编译 Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --info

      # 6. 验证 APK 签名
      - name: Check APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n1)
          find tv/build/outputs/apk/release -name 'mytv-android-tv-*.apk' | while read apk; do
            echo "🔍  Checking $apk"
            "$APKSIGNER" verify --verbose "$apk"
            if [ $? -ne 0 ]; then exit 1; fi
          done

      # 7. 核對通用、64 位元及 32 位元 APK
      - name: Locate APKs
        run: |
          shopt -s nullglob
          apks=(tv/build/outputs/apk/release/mytv-android-tv-*.apk)
          [ "${#apks[@]}" -eq 3 ] || { echo "❌ Expected 3 APKs, found ${#apks[@]}"; exit 1; }
          for suffix in all arm64-v8a armeabi-v7a; do
            compgen -G "tv/build/outputs/apk/release/mytv-android-tv-*-$suffix-sdk21.apk" > /dev/null || {
              echo "❌ Missing $suffix APK"
              exit 1
            }
          done
          printf 'Found APK: %s\n' "${apks[@]}"

      # 8. 发布到 GitHub Release (自动创建或更新)
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: tv/build/outputs/apk/release/mytv-android-tv-*.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: false
          prerelease: ${{ contains(env.TAG, '-beta') || contains(env.TAG, '-rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
