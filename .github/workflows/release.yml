name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出源码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，确保能找到所有 tag

      - name: Checkout tag
        run: |
          # 确定目标 TAG
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          
          echo "Target TAG: $TAG"
          
          # 切换到指定 TAG
          git fetch --tags --force
          git checkout "$TAG"
          
          echo "TAG=$TAG" >> $GITHUB_ENV

      # 2. 配置 JDK
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 赋予 Gradle 可执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. 导入签名密钥
      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 --decode > release.keystore
          echo "RELEASE_STORE_FILE=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.SIGNING_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PWD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PWD }}" >> $GITHUB_ENV

      # 5. 编译 Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --info

      # 6. 验证 APK 签名
      - name: Check APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n1)
          find tv/build/outputs/apk/release -name 'mytv-android-tv-*.apk' | while read apk; do
            echo "🔍  Checking $apk"
            "$APKSIGNER" verify --verbose "$apk"
            if [ $? -ne 0 ]; then exit 1; fi
          done

      # 7. 定位 APK 文件
      - name: Locate APK
        id: apk
        run: |
          apk_path=$(find tv/build/outputs/apk/release -name 'mytv-android-tv-*.apk' | head -n1)
          [ -z "$apk_path" ] && { echo "❌ APK not found"; exit 1; }
          echo "Found APK: $apk_path"
          echo "apk_path=$apk_path" >> $GITHUB_OUTPUT

      # 8. 校验 TAG 格式 (放宽限制，允许 beta/rc 等后缀)
      - name: Check TAG validity
        run: |
          tag="${{ env.TAG }}"
          if [[ -z "$tag" ]]; then
            echo "❌ TAG is empty."
            exit 1
          fi
          # 只要以 v 开头即可，避免过于严格的正则导致失败
          if [[ ! "$tag" =~ ^v.*$ ]]; then
            echo "❌ TAG 格式警告: 建议以 'v' 开头 (当前: $tag)"
            # 这里可以选择 exit 1 报错，或者仅警告
          fi
          echo "TAG=$tag" >> $GITHUB_ENV

      # 9. 发布到 GitHub Release (自动创建或更新)
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
